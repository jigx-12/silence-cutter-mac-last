<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Silence Cutter</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08050d;
    --panel: #120a1e;
    --panel-2: #170e26;
    --border: #2b1a42;
    --accent-1: #5b1fc9;
    --accent-2: #a83aef;
    --accent-3: #6e3bff;
    --accent-1-dim: #4a1a99;
    --text: #ece4fb;
    --text-dim: #8f7cae;
    --gold: #e8c877;
    --ok: #8fe3a0;
    --err: #ff7d95;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 140% at 50% -10%, #1b0f30 0%, var(--bg) 55%), var(--bg);
    color: var(--text);
    margin: 0;
    padding: 14px;
    font-size: 12px;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px 0;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, var(--gold), #fff2cf 40%, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }
  .row { margin-bottom: 11px; }
  label { display: block; margin-bottom: 4px; color: var(--text-dim); }
  .row-inline { display: flex; justify-content: space-between; align-items: center; }
  input[type="number"], input[type="text"] {
    background: #0b0713;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 7px;
    width: 66px;
  }
  input[type="text"].wide { width: 100%; box-sizing: border-box; }
  input[type="number"]:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 2px rgba(168, 58, 239, 0.25);
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent-2);
  }
  input[type="checkbox"] {
    accent-color: var(--accent-2);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }
  button {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    border: none;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.3px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(120deg, var(--accent-1) 0%, var(--accent-3) 55%, var(--accent-2) 100%);
    box-shadow: 0 4px 18px rgba(110, 59, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: filter 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
  }
  button:hover:not(:disabled) {
    filter: brightness(1.15);
    box-shadow: 0 6px 22px rgba(110, 59, 255, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled {
    background: #1a1229;
    color: #574a72;
    box-shadow: none;
    cursor: default;
  }
  button.secondary {
    background: linear-gradient(120deg, #35204f 0%, #4d2a73 100%);
    box-shadow: 0 3px 12px rgba(74, 26, 122, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    box-shadow: none;
    color: var(--text-dim);
    font-weight: 600;
    border-radius: 999px;
  }
  button.ghost:hover:not(:disabled) { filter: none; border-color: var(--accent-2); color: var(--text); box-shadow: 0 0 0 2px rgba(168, 58, 239, 0.15); }
  #log {
    background: #0b0713;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    height: 150px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    white-space: pre-wrap;
    margin-top: 12px;
  }
  #log div { padding: 1px 0; }
  .stat { color: var(--gold); }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  .dim { color: var(--text-dim); }
  details { margin-top: 9px; }
  summary {
    cursor: pointer;
    color: var(--text-dim);
    outline: none;
  }
  summary:hover { color: var(--text); }
  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }
  #licenseGate {
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  #licenseGate.visible { display: flex; }
  #mainUI.hidden { display: none; }
  .lic-status {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <h1>✦ Silence Cutter</h1>

  <div id="licenseGate">
    <label for="licenseKeyInput">License key</label>
    <input type="text" id="licenseKeyInput" class="wide" placeholder="SC-XXXX-XXXX-XXXX-XXXX">
    <button id="activateBtn">Activate</button>
    <div id="licenseError" class="lic-status err"></div>
  </div>

  <div id="mainUI" class="hidden">
  <div class="row">
    <div class="row-inline"><label for="threshold">VAD threshold</label><input type="number" id="threshold" min="0" max="1" step="0.05" value="0.5"></div>
    <input type="range" id="thresholdRange" min="0" max="1" step="0.05" value="0.5">
  </div>
  <div class="row row-inline">
    <label for="minSilence">Min silence to cut (ms)</label>
    <input type="number" id="minSilence" value="400">
  </div>
  <div class="row row-inline">
    <label for="padding">Padding around speech (ms)</label>
    <input type="number" id="padding" value="120">
  </div>
  <div class="row row-inline">
    <label for="minSpeech">Min speech blip to keep (ms)</label>
    <input type="number" id="minSpeech" value="200">
  </div>

  <details>
    <summary>Advanced</summary>
    <div class="row">
      <label for="ffmpegPath">ffmpeg path (leave as "ffmpeg" if it's on PATH)</label>
      <input type="text" id="ffmpegPath" class="wide" value="ffmpeg">
    </div>
    <button id="diagBtn" class="ghost" type="button">Run Diagnostics</button>
  </details>

  <hr>

  <div class="row row-inline">
    <label for="combineToggle" style="margin-bottom:0;">Combine into one layer</label>
    <input type="checkbox" id="combineToggle" checked>
  </div>

  <button id="analyzeBtn">Analyze Selected Layer</button>
  <button id="applyBtn" class="secondary" disabled>Apply (Remove Silence)</button>

  <hr>

  <button id="stackBtn" class="secondary" type="button">Stack Layers (No Gap)</button>
  </div>

  <div id="log"></div>

  <script src="./CSInterface.js"></script>
  <script src="./main.js"></script>
</body>
</html>
